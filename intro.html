<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enter The Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@300..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════════════════════
   GLOBAL RESET & VARIABLES
═══════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --c-black:   #000000;
  --c-deep:    #04040a;
  --c-orange:  #e8621a;
  --c-orange2: #ff8040;
  --c-glow:    rgba(232,98,26,0.55);
  --c-silver:  #a8aab8;
  --c-white:   #ffffff;
  --c-neon:    rgba(255,255,255,0.92);
  --f-display: 'Bricolage Grotesque', sans-serif;
  --f-hud:     'JetBrains Mono', monospace;
  --f-body:    'Geist', sans-serif;
  --ease-out:  cubic-bezier(0.16, 1, 0.3, 1);
  --ease-cin:  cubic-bezier(0.77, 0, 0.18, 1);
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--c-black);
  font-family: var(--f-body);
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

/* ═══════════════════════════════════════════════════════════════
   ROOT WRAPPER
═══════════════════════════════════════════════════════════════ */
#aw-intro {
  position: fixed;
  inset: 0;
  z-index: 9999;
  overflow: hidden;
  background: #000;
}

/* ═══════════════════════════════════════════════════════════════
   LETTERBOX BARS
═══════════════════════════════════════════════════════════════ */
.lb { position: absolute; left: 0; right: 0; z-index: 900; background: #000; transition: height 1.4s var(--ease-cin); }
.lb-top    { top: 0;    height: 90px; }
.lb-bottom { bottom: 0; height: 90px; }
.lb-top.open    { height: 0; }
.lb-bottom.open { height: 0; }

/* ═══════════════════════════════════════════════════════════════
   SKIP BUTTON
═══════════════════════════════════════════════════════════════ */
#aw-skip {
  position: absolute;
  top: 22px; right: 28px;
  z-index: 950;
  font-family: var(--f-hud);
  font-size: 9px;
  letter-spacing: .3em;
  color: rgba(255,255,255,.3);
  border: 1px solid rgba(255,255,255,.1);
  background: rgba(0,0,0,.4);
  backdrop-filter: blur(12px);
  padding: 9px 22px;
  border-radius: 2px;
  cursor: pointer;
  opacity: 0;
  transition: color .3s, border-color .3s, opacity .6s;
  animation: skipReveal 1s ease 4s forwards;
  pointer-events: none;
}
#aw-skip.ready { pointer-events: all; }
#aw-skip:hover { color: var(--c-orange); border-color: var(--c-orange); }
@keyframes skipReveal { to { opacity: 1; } }

/* ═══════════════════════════════════════════════════════════════
   HUD OVERLAY (corners + status)
═══════════════════════════════════════════════════════════════ */
.hud-corner {
  position: absolute;
  width: 54px; height: 54px;
  z-index: 80;
  opacity: 0;
  transition: opacity 1.2s ease;
}
.hud-corner.show { opacity: 1; }
.hud-tl { top: 18px; left: 18px; border-top: 1px solid rgba(232,98,26,.35); border-left: 1px solid rgba(232,98,26,.35); }
.hud-tr { top: 18px; right: 18px; border-top: 1px solid rgba(232,98,26,.35); border-right: 1px solid rgba(232,98,26,.35); }
.hud-bl { bottom: 18px; left: 18px; border-bottom: 1px solid rgba(232,98,26,.35); border-left: 1px solid rgba(232,98,26,.35); }
.hud-br { bottom: 18px; right: 18px; border-bottom: 1px solid rgba(232,98,26,.35); border-right: 1px solid rgba(232,98,26,.35); }

#hud-bar {
  position: absolute;
  bottom: 24px; left: 50%;
  transform: translateX(-50%);
  z-index: 80;
  font-family: var(--f-hud);
  font-size: 7.5px;
  letter-spacing: .5em;
  color: rgba(232,98,26,.45);
  white-space: nowrap;
  opacity: 0;
  transition: opacity 1s ease;
}
#hud-bar.show { opacity: 1; }
#hud-bar::before { content: '◉ '; animation: blink 1.8s step-start infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* Scene dots */
#scene-dots {
  position: absolute;
  right: 24px;
  top: 50%; transform: translateY(-50%);
  z-index: 80;
  display: flex;
  flex-direction: column;
  gap: 12px;
  opacity: 0;
  transition: opacity 1s ease;
}
#scene-dots.show { opacity: 1; }
.sdot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: rgba(255,255,255,.18);
  transition: all .5s ease;
}
.sdot.on  { background: var(--c-orange); box-shadow: 0 0 8px var(--c-glow); transform: scale(1.6); }
.sdot.done{ background: rgba(232,98,26,.35); }

/* ═══════════════════════════════════════════════════════════════
   PARTICLE CANVAS
═══════════════════════════════════════════════════════════════ */
#aw-canvas {
  position: absolute;
  inset: 0;
  z-index: 15;
  pointer-events: none;
}

/* ═══════════════════════════════════════════════════════════════
   VIGNETTE
═══════════════════════════════════════════════════════════════ */
.vignette {
  position: absolute;
  inset: 0;
  z-index: 12;
  background: radial-gradient(ellipse at 50% 50%, transparent 25%, rgba(0,0,0,.8) 100%);
  pointer-events: none;
}
.vignette-bottom {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 40%;
  z-index: 13;
  background: linear-gradient(to top, rgba(0,0,0,.75) 0%, transparent 100%);
  pointer-events: none;
}

/* ═══════════════════════════════════════════════════════════════
   SCENE 1 — TRACK INTRO
═══════════════════════════════════════════════════════════════ */
#scene1 {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
}

/* Fog/smoke layers */
.fog-layer {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  opacity: 0;
  transition: opacity 2s ease;
}
.fog-layer.show { opacity: 1; }
.fog-1 {
  background:
    radial-gradient(ellipse 80% 30% at 30% 85%, rgba(232,98,26,.04) 0%, transparent 70%),
    radial-gradient(ellipse 60% 25% at 70% 90%, rgba(255,140,60,.03) 0%, transparent 60%);
}
.fog-2 {
  background: radial-gradient(ellipse 100% 20% at 50% 100%, rgba(20,10,5,.9) 0%, transparent 100%);
}

/* Light rays */
.rays-wrap {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  overflow: hidden;
  opacity: 0;
  transition: opacity 2.5s ease;
}
.rays-wrap.show { opacity: 1; }
.ray {
  position: absolute;
  top: -40%;
  width: 1.5px;
  height: 180%;
  background: linear-gradient(180deg, transparent 0%, rgba(255,140,60,.05) 40%, rgba(232,98,26,.08) 65%, transparent 100%);
  transform-origin: top center;
}

/* ─── LEFT: Cinematic Text ─── */
#s1-text {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 48%;
  z-index: 30;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 0 0 6vw;
}

.s1-accent {
  width: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--c-orange), rgba(232,98,26,0));
  box-shadow: 0 0 12px var(--c-glow);
  margin-bottom: 28px;
  transition: width 1.2s var(--ease-out) .3s;
}
.s1-accent.show { width: 72px; }

.s1-line {
  font-family: var(--f-display);
  font-size: clamp(58px, 8.5vw, 128px);
  line-height: .9;
  color: var(--c-white);
  letter-spacing: .03em;
  opacity: 0;
  transform: translateY(36px) skewX(-1deg);
  filter: blur(12px);
  transition: opacity 1s var(--ease-out), transform 1s var(--ease-out), filter .9s ease, letter-spacing .8s ease;
  will-change: transform, opacity, filter;
  text-shadow:
    0 0 60px rgba(232,98,26,.15),
    0 2px 40px rgba(0,0,0,.9);
}
.s1-line.show {
  opacity: 1;
  transform: translateY(0) skewX(0deg);
  filter: blur(0px);
  letter-spacing: .05em;
}
.s1-line em {
  font-style: normal;
  color: var(--c-orange);
  text-shadow: 0 0 30px rgba(232,98,26,.6), 0 0 80px rgba(232,98,26,.2);
}

.s1-sub {
  font-family: var(--f-hud);
  font-size: clamp(8px, 1vw, 11px);
  letter-spacing: .45em;
  color: var(--c-silver);
  text-transform: uppercase;
  margin-top: 30px;
  opacity: 0;
  transform: translateX(-18px);
  transition: opacity .9s ease .2s, transform .9s var(--ease-out) .2s;
}
.s1-sub.show { opacity: .55; transform: translateX(0); }

/* ─── RIGHT: Track + Car ─── */
#s1-track-zone {
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 56%;
  z-index: 25;
  overflow: visible;
}

#track-svg {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  overflow: visible;
}

/* RC Car container */
#rc-car {
  position: absolute;
  z-index: 35;
  width: 200px;
  height: 120px;
  transform-origin: 50% 75%;
  will-change: transform, left, top;
  filter:
    drop-shadow(0 10px 28px rgba(0,0,0,.95))
    drop-shadow(0 0 20px rgba(232,98,26,.08));
  pointer-events: none;
}
#rc-car img {
  width: 100%; height: 100%;
  object-fit: contain;
  object-position: center bottom;
  display: block;
}

/* Headlight glow */
#hl-glow {
  position: absolute;
  right: 6px;
  top: 35%;
  width: 22px; height: 16px;
  background: radial-gradient(ellipse, rgba(255,245,200,1) 0%, rgba(255,210,120,.5) 45%, transparent 100%);
  border-radius: 50%;
  pointer-events: none;
  box-shadow:
    0 0 24px 10px rgba(255,230,130,.5),
    0 0 70px 28px rgba(255,210,80,.18);
  animation: hlPulse 2.2s ease-in-out infinite;
}
@keyframes hlPulse { 0%,100%{opacity:.88;} 50%{opacity:1;} }

/* Headlight beam */
#hl-beam {
  position: absolute;
  right: -90px;
  top: 28%;
  width: 140px; height: 65px;
  background: linear-gradient(to right, rgba(255,240,160,.12) 0%, rgba(255,230,100,.04) 50%, transparent 100%);
  border-radius: 0 50% 50% 0;
  transform: skewY(-6deg);
  filter: blur(5px);
  pointer-events: none;
}

/* Tail light */
#tl-glow {
  position: absolute;
  left: 10px;
  top: 45%;
  width: 8px; height: 14px;
  background: radial-gradient(ellipse, #ff2200 0%, #991100 60%, transparent 100%);
  border-radius: 2px;
  box-shadow: 0 0 16px 6px rgba(255,30,0,.6);
  pointer-events: none;
  animation: tlPulse 2.2s ease-in-out infinite;
}
@keyframes tlPulse { 0%,100%{opacity:.8;} 50%{opacity:1;} }

/* Ground reflection under car */
#car-refl {
  position: absolute;
  bottom: -10px;
  left: 50%; transform: translateX(-50%);
  width: 170px; height: 16px;
  background: radial-gradient(ellipse, rgba(0,0,0,.9) 0%, transparent 70%);
  filter: blur(7px);
  pointer-events: none;
}

/* ═══════════════════════════════════════════════════════════════
   SCENE 2 — ENVIRONMENT JOURNEY
═══════════════════════════════════════════════════════════════ */
#scene2 {
  position: absolute;
  inset: 0;
  z-index: 18;
  opacity: 0;
  pointer-events: none;
  transition: opacity 2s ease;
}
#scene2.show { opacity: 1; pointer-events: all; }

/* Environment layers */
.env-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  opacity: 0;
  transform: scale(1.07);
  filter: brightness(.22) saturate(.55);
  transition: opacity 2.2s ease, transform 14s ease-out, filter 2.2s ease;
  will-change: opacity, transform;
}
.env-bg.active {
  opacity: 1;
  transform: scale(1);
  filter: brightness(.25) saturate(.65);
}

/* Env overlay gradient (adds depth + ground) */
.env-overlay {
  position: absolute;
  inset: 0;
  z-index: 3;
  background:
    radial-gradient(ellipse at 50% 50%, transparent 20%, rgba(0,0,0,.82) 100%),
    linear-gradient(to top, rgba(0,0,0,.8) 0%, transparent 45%);
  pointer-events: none;
}

/* Scene 2 car (clone positioned from JS) */
#s2-car-zone {
  position: absolute;
  inset: 0;
  z-index: 25;
  pointer-events: none;
}
/* The actual car element is #rc-car (shared) — JS moves it */

/* Env caption */
#env-caption {
  position: absolute;
  left: 50%; bottom: 28%;
  transform: translate(-50%, 0);
  z-index: 40;
  text-align: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity .7s ease;
}
#env-caption.show { opacity: 1; }
.env-cap-title {
  font-family: var(--f-display);
  font-size: clamp(52px, 7.5vw, 118px);
  color: var(--c-white);
  line-height: 1;
  letter-spacing: .06em;
  text-shadow: 0 0 60px rgba(232,98,26,.2), 0 4px 50px rgba(0,0,0,.95);
}
.env-cap-sub {
  font-family: var(--f-hud);
  font-size: clamp(7px, .85vw, 10px);
  letter-spacing: .5em;
  color: var(--c-silver);
  opacity: .55;
  margin-top: 14px;
  text-transform: uppercase;
}

/* Scene 2 track (full width ground line) */
#s2-track-svg {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  z-index: 20;
  pointer-events: none;
  overflow: visible;
}

/* ═══════════════════════════════════════════════════════════════
   SCENE 3 — PORTAL
═══════════════════════════════════════════════════════════════ */
#scene3 {
  position: absolute;
  inset: 0;
  z-index: 22;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1.6s ease;
}
#scene3.show { opacity: 1; pointer-events: all; }

/* Portal background radiance */
.portal-radiance {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 70% 60% at 50% 50%, rgba(232,98,26,.09) 0%, transparent 65%),
    radial-gradient(ellipse 50% 40% at 50% 65%, rgba(232,98,26,.06) 0%, transparent 55%);
  pointer-events: none;
  animation: radPulse 4s ease-in-out infinite;
}
@keyframes radPulse {
  0%,100% { opacity: .7; }
  50%      { opacity: 1; }
}

/* Portal ring SVG wrapper */
#portal-wrap {
  position: relative;
  width: clamp(300px, 42vw, 520px);
  height: clamp(300px, 42vw, 520px);
  margin-bottom: 38px;
  animation: portalFloat 5s ease-in-out infinite;
}
@keyframes portalFloat {
  0%,100% { transform: translateY(0px); }
  50%      { transform: translateY(-8px); }
}

#portal-svg {
  width: 100%; height: 100%;
  overflow: visible;
  filter:
    drop-shadow(0 0 30px rgba(232,98,26,.45))
    drop-shadow(0 0 90px rgba(232,98,26,.18));
  animation: portalGlow 3.5s ease-in-out infinite;
}
@keyframes portalGlow {
  0%,100% { filter: drop-shadow(0 0 30px rgba(232,98,26,.45)) drop-shadow(0 0 90px rgba(232,98,26,.18)); }
  50%      { filter: drop-shadow(0 0 55px rgba(232,98,26,.75)) drop-shadow(0 0 130px rgba(232,98,26,.3)); }
}

/* Portal SVG spinning rings via CSS */
.p-spin-cw  { animation: pSpinCW  9s linear infinite; transform-origin: 250px 250px; }
.p-spin-ccw { animation: pSpinCCW 13s linear infinite; transform-origin: 250px 250px; }
.p-spin-cw2 { animation: pSpinCW  6s linear infinite; transform-origin: 250px 250px; }
@keyframes pSpinCW  { from{stroke-dashoffset:0;} to{stroke-dashoffset:-628;} }
@keyframes pSpinCCW { from{stroke-dashoffset:0;} to{stroke-dashoffset:628;} }

/* Enter Button */
#enter-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  cursor: pointer;
  text-decoration: none;
  outline: none;
  border: none;
  background: none;
  padding: 0;
}

.enter-inner {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 20px 60px;
  border: 1px solid rgba(232,98,26,.45);
  background: linear-gradient(135deg,
    rgba(232,98,26,.09) 0%,
    rgba(232,98,26,.04) 50%,
    rgba(255,255,255,.02) 100%);
  backdrop-filter: blur(24px);
  border-radius: 2px;
  overflow: hidden;
  transition: border-color .4s ease, box-shadow .4s ease, transform .4s ease;
}

/* Scan line */
.enter-inner::before {
  content: '';
  position: absolute;
  top: -120%; left: 0; right: 0;
  height: 100%;
  background: linear-gradient(180deg, transparent 0%, rgba(232,98,26,.07) 50%, transparent 100%);
  animation: scanAnim 3s ease-in-out infinite;
}
@keyframes scanAnim {
  0%   { top: -120%; }
  100% { top: 220%; }
}

/* Shimmer fill on hover */
.enter-inner::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(232,98,26,.14), rgba(232,98,26,.05));
  opacity: 0;
  transition: opacity .4s ease;
}

#enter-btn:hover .enter-inner::after { opacity: 1; }
#enter-btn:hover .enter-inner {
  border-color: rgba(232,98,26,.85);
  box-shadow: 0 0 50px rgba(232,98,26,.28), inset 0 0 35px rgba(232,98,26,.05);
  transform: translateY(-3px);
}

.enter-label {
  font-family: var(--f-hud);
  font-size: clamp(10px, 1.3vw, 14px);
  letter-spacing: .45em;
  color: var(--c-white);
  text-transform: uppercase;
  position: relative;
  z-index: 1;
}

.enter-arrow {
  position: relative;
  z-index: 1;
  transition: transform .4s ease;
  line-height: 0;
}
#enter-btn:hover .enter-arrow { transform: translateX(5px); }

/* HUD notch corners on enter btn */
.btn-corner { position: absolute; width: 12px; height: 12px; border-color: rgba(232,98,26,.5); border-style: solid; }
.btn-corner.tl { top:-7px; left:-7px; border-width:2px 0 0 2px; }
.btn-corner.tr { top:-7px; right:-7px; border-width:2px 2px 0 0; }
.btn-corner.bl { bottom:-7px; left:-7px; border-width:0 0 2px 2px; }
.btn-corner.br { bottom:-7px; right:-7px; border-width:0 2px 2px 0; }

/* Tagline below button */
#enter-tag {
  font-family: var(--f-hud);
  font-size: clamp(6.5px, .7vw, 8.5px);
  letter-spacing: .55em;
  color: rgba(255,255,255,.2);
  text-transform: uppercase;
  margin-top: 28px;
  animation: tagPulse 2.5s ease-in-out infinite;
}
@keyframes tagPulse { 0%,100%{opacity:.35;} 50%{opacity:.75;} }

/* ═══════════════════════════════════════════════════════════════
   MOTION BLUR WIPE
═══════════════════════════════════════════════════════════════ */
#mb-wipe {
  position: fixed;
  inset: 0;
  z-index: 8800;
  background: #000;
  transform: scaleX(0);
  transform-origin: left;
  pointer-events: none;
}
#mb-wipe.in  { animation: wipeIn  .75s var(--ease-cin) forwards; }
#mb-wipe.out { animation: wipeOut .75s var(--ease-cin) forwards; }
@keyframes wipeIn  { from{transform:scaleX(0);} to{transform:scaleX(1);} }
@keyframes wipeOut { from{transform:scaleX(1);} to{transform:scaleX(0);} transform-origin: right; }

/* Flash */
#flash {
  position: fixed;
  inset: 0;
  z-index: 9200;
  background: rgba(255,255,255,.85);
  opacity: 0;
  pointer-events: none;
  transition: opacity .12s ease;
}
#flash.on { opacity: 1; }

/* ═══════════════════════════════════════════════════════════════
   MOBILE
═══════════════════════════════════════════════════════════════ */
@media (max-width: 768px) {
  .lb-top, .lb-bottom { height: 50px; }
  #s1-text { width: 100%; padding: 0 5vw; justify-content: flex-start; padding-top: 18vh; }
  .s1-line { font-size: clamp(44px, 12vw, 80px); }
  #s1-track-zone { width: 100%; top: auto; bottom: 0; height: 42%; }
  #rc-car { width: 140px; height: 84px; }
  #portal-wrap { width: min(280px, 82vw); height: min(280px, 82vw); }
  .enter-inner { padding: 16px 36px; }
}
@media (max-width: 480px) {
  .s1-line { font-size: clamp(38px, 13vw, 64px); }
}
</style>
</head>
<body>

<div id="aw-intro">

  <!-- Letterbox -->
  <div class="lb lb-top"    id="lb-t"></div>
  <div class="lb lb-bottom" id="lb-b"></div>

  <!-- Skip -->
  <button id="aw-skip" onclick="doSkip()">SKIP INTRO</button>

  <!-- HUD -->
  <div class="hud-corner hud-tl" id="hud-tl"></div>
  <div class="hud-corner hud-tr" id="hud-tr"></div>
  <div class="hud-corner hud-bl" id="hud-bl"></div>
  <div class="hud-corner hud-br" id="hud-br"></div>
  <div id="hud-bar">ENTER THE EXPERIENCE</div>

  <!-- Scene dots -->
  <div id="scene-dots">
    <div class="sdot on"  id="dot0"></div>
    <div class="sdot"     id="dot1"></div>
    <div class="sdot"     id="dot2"></div>
    <div class="sdot"     id="dot3"></div>
    <div class="sdot"     id="dot4"></div>
  </div>

<script>
/* ════════════════════════════════════════════════════════════════
   AFRICA WEB — CINEMATIC INTRO ENGINE  v2.0
════════════════════════════════════════════════════════════════ */
'use strict';

/* ── Shorthand ───────────────────────────────────────────────── */
const $ = id => document.getElementById(id);
const qs = s => document.querySelector(s);

/* ── State ───────────────────────────────────────────────────── */
let VW = innerWidth, VH = innerHeight;
let scene      = 0;   // 0=s1, 1–4=env, 5=portal
let carT       = 0;   // 0..1 along track
let carX       = 0;
let carY       = 0;
let lastTS     = 0;
let dustArr    = [];
let partArr    = [];
let rafID;
let tmrID;
let entering   = false;

/* ── Speed: how fast car traverses scene track (scene1) ──────── */
const S1_SPEED  = 0.000040; // units/ms
const S2_SPEED  = 0.000045;

/* ── Scene durations (ms) ────────────────────────────────────── */
const DURATIONS = [5400, 3200, 3200, 3200, 3200, 99999];

/* ── Env scene data ──────────────────────────────────────────── */
const ENVS = [
  { id:'env-living', title:'Living Room',     sub:'SCENE 02 · INTERIOR WORLD' },
  { id:'env-office', title:'Corporate',        sub:'SCENE 03 · OFFICE WORLD'   },
  { id:'env-school', title:'Campus',           sub:'SCENE 04 · SCHOOL WORLD'   },
  { id:'env-resort', title:'Luxury Resort',    sub:'SCENE 05 · OUTDOOR WORLD'  },
];

/* ── Car config ──────────────────────────────────────────────── */
const CAR_W = () => VW < 768 ? 140 : 200;
const CAR_H = () => VW < 768 ? 84  : 120;

/* ── DOM refs ────────────────────────────────────────────────── */
const car      = $('rc-car');
const s1Zone   = $('s1-track-zone');
const canvas   = $('aw-canvas');
const ctx      = canvas.getContext('2d');

/* Track SVG paths – Scene 1 */
const tBase    = $('t-base');
const tHalo    = $('t-halo');
const tActive  = $('t-active');
const tDash    = $('t-dash');

/* Track SVG paths – Scene 2 */
const s2Base   = $('s2-base');
const s2Active = $('s2-active');

/* UI */
const lbT      = $('lb-t');
const lbB      = $('lb-b');
const skip     = $('aw-skip');
const wipe     = $('mb-wipe');
const flash    = $('flash');

/* ════════════════════════════════════════════════════════════════
   TRACK GEOMETRY
════════════════════════════════════════════════════════════════ */

/* Scene 1 track: inside the right zone (56% of VW wide) */
function s1TrackD() {
  const zW = s1Zone.offsetWidth;
  const zH = s1Zone.offsetHeight;
  const x0 = -20;
  const x1 = zW + 20;
  const yB = zH * 0.74;        // baseline
  const dip = zH * 0.10;       // belly depth
  const cpX = zW * 0.48, cpY = yB + dip;
  return `M${x0},${yB} Q${cpX},${cpY} ${x1},${yB}`;
}

/* Scene 2 track: full VW straight gentle arc */
function s2TrackD() {
  const x0 = -30, x1 = VW + 30;
  const yB = VH * 0.80;
  const dip = VH * 0.04;
  const cpX = VW * 0.5, cpY = yB + dip;
  return `M${x0},${yB} Q${cpX},${cpY} ${x1},${yB}`;
}

function setS1Paths(d) {
  [tBase, tHalo, tActive, tDash].forEach(p => p && p.setAttribute('d', d));
}
function setS2Paths(d) {
  [s2Base, s2Active].forEach(p => p && p.setAttribute('d', d));
}

/* ════════════════════════════════════════════════════════════════
   PATH EVALUATION
════════════════════════════════════════════════════════════════ */
function ptAtT(path, t) {
  const len = path.getTotalLength();
  return path.getPointAtLength(t * len);
}
function angleAtT(path, t) {
  const len = path.getTotalLength();
  const eps = 2;
  const a = path.getPointAtLength(Math.max(0, t * len - eps));
  const b = path.getPointAtLength(Math.min(len, t * len + eps));
  return Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
}

/* Active track (draws the orange "burned" path behind the car) */
function buildActivePath(fullPath, t) {
  /* De Casteljau split for quadratic bezier */
  const str = fullPath.getAttribute('d');
  const m   = str.match(/M([\d.\-]+),([\d.\-]+)\s+Q([\d.\-]+),([\d.\-]+)\s+([\d.\-]+),([\d.\-]+)/);
  if (!m) return str;
  const [, x0,y0, cx,cy, x1,y1] = m.map(Number);
  const t0 = Math.min(t, 1);
  // De Casteljau split at t0
  const ax = lerp(x0,cx,t0), ay = lerp(y0,cy,t0);
  const bx = lerp(cx,x1,t0), by_ = lerp(cy,y1,t0);
  const qx = lerp(ax,bx,t0), qy = lerp(ay,by_,t0);
  return `M${x0},${y0} Q${ax},${ay} ${qx},${qy}`;
}

function lerp(a, b, t) { return a + (b - a) * t; }

/* ════════════════════════════════════════════════════════════════
   CANVAS PARTICLE SYSTEM
════════════════════════════════════════════════════════════════ */
function resizeCanvas() {
  canvas.width  = VW;
  canvas.height = VH;
}

function spawnAmbient() {
  const isOrange = Math.random() < 0.22;
  partArr.push({
    x: Math.random() * VW,
    y: Math.random() * VH,
    r: Math.random() * 1.4 + 0.2,
    vx: (Math.random() - 0.5) * 0.18,
    vy: -(Math.random() * 0.28 + 0.04),
    a: Math.random() * 0.45 + 0.08,
    col: isOrange ? [232,98,26] : [255,255,255],
    life: 1,
    dec: Math.random() * 0.0025 + 0.0008,
  });
}

function spawnDust(x, y) {
  for (let i = 0; i < 4; i++) {
    dustArr.push({
      x, y: y + 8,
      vx: -(Math.random() * 2.2 + 0.4),
      vy: (Math.random() - 0.5) * 0.6,
      r:  Math.random() * 4 + 2,
      life: 1,
    });
  }
}

function drawParticles() {
  ctx.clearRect(0, 0, VW, VH);

  /* Ambient */
  while (partArr.length < 90) spawnAmbient();
  partArr = partArr.filter(p => p.life > 0);
  for (const p of partArr) {
    p.x += p.vx; p.y += p.vy; p.life -= p.dec;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${p.col[0]},${p.col[1]},${p.col[2]},${p.a * p.life})`;
    ctx.fill();
  }

  /* Dust trail */
  dustArr = dustArr.filter(d => d.life > 0);
  for (const d of dustArr) {
    d.x += d.vx; d.y += d.vy; d.life -= 0.022; d.r += 0.5;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(130,90,55,${d.life * 0.1})`;
    ctx.fill();
  }
}

/* ════════════════════════════════════════════════════════════════
   CAR MOVEMENT
════════════════════════════════════════════════════════════════ */
function moveCar(dt) {
  if (scene === 5) return;

  const speed = (scene === 0) ? S1_SPEED : S2_SPEED;
  carT = Math.min(1, carT + speed * dt);
  if (carT >= 1) carT = 0;  // loop

  const activePath = scene === 0 ? tBase : s2Base;
  if (!activePath || !activePath.getTotalLength) return;

  const cW = CAR_W(), cH = CAR_H();
  const pt    = ptAtT(activePath, carT);
  const angle = angleAtT(activePath, carT);

  /* Organic suspension: two sine waves */
  const now   = performance.now();
  const bounce = Math.sin(now * 0.0095) * 2.1 + Math.sin(now * 0.0178) * 0.7;
  const roll   = Math.sin(now * 0.0072) * 1.4;

  /* Scene 1: car is relative to s1-track-zone */
  let absX, absY;
  if (scene === 0) {
    const zRect = s1Zone.getBoundingClientRect();
    absX = zRect.left + pt.x - cW * 0.5;
    absY = zRect.top  + pt.y - cH * 0.62 + bounce;
  } else {
    absX = pt.x - cW * 0.5;
    absY = pt.y - cH * 0.55 + bounce;
  }

  car.style.left      = absX + 'px';
  car.style.top       = absY + 'px';
  car.style.width     = cW + 'px';
  car.style.height    = cH + 'px';
  car.style.transform = `rotate(${angle + roll}deg)`;
  car.style.opacity   = '1';

  carX = absX; carY = absY;

  /* Draw active segment */
  if (scene === 0) {
    const fullD = tBase.getAttribute('d');
    const splitD = buildActivePath(tBase, carT);
    tActive.setAttribute('d', splitD);
  } else {
    const splitD = buildActivePath(s2Base, carT);
    s2Active.setAttribute('d', splitD);
  }

  /* Dust */
  if (Math.random() < 0.11) spawnDust(absX + 18, absY + cH * 0.85);
}

/* ════════════════════════════════════════════════════════════════
   MAIN LOOP
════════════════════════════════════════════════════════════════ */
function loop(ts) {
  const dt = Math.min(ts - lastTS, 60);
  lastTS = ts;
  moveCar(dt);
  drawParticles();
  rafID = requestAnimationFrame(loop);
}

/* ════════════════════════════════════════════════════════════════
   SCENE MANAGEMENT
════════════════════════════════════════════════════════════════ */

/* --- SCENE 1 reveal ----------------------------------------- */
function startScene1() {
  /* Open letterbox bars */
  setTimeout(() => { lbT.classList.add('open'); lbB.classList.add('open'); }, 400);

  /* Show HUD after bars open */
  setTimeout(() => {
    ['hud-tl','hud-tr','hud-bl','hud-br'].forEach(id => $(id).classList.add('show'));
    $('hud-bar').classList.add('show');
    $('scene-dots').classList.add('show');
  }, 1100);

  /* Fog & rays */
  setTimeout(() => {
    $('fog1').classList.add('show');
    $('fog2').classList.add('show');
    $('rays').classList.add('show');
  }, 600);

  /* Text lines */
  setTimeout(() => $('s1-bar').classList.add('show'),  1200);
  setTimeout(() => $('l1').classList.add('show'),      1900);
  setTimeout(() => $('l2').classList.add('show'),      2850);
  setTimeout(() => $('l3').classList.add('show'),      3750);
  setTimeout(() => $('l4').classList.add('show'),      4600);

  /* Skip button */
  skip.classList.add('ready');

  /* Schedule transition */
  tmrID = setTimeout(goScene2, DURATIONS[0]);
}

/* --- SCENE 2 ------------------------------------------------- */
let envIdx = 0;
function goScene2() {
  scene = 1;
  updateDots(1);
  carT = 0;

  /* Build scene2 track */
  setS2Paths(s2TrackD());

  /* Wipe in */
  wipeIn(() => {
    /* Switch from scene1 car zone to scene2 car zone */
    $('scene1').style.zIndex = '5';
    $('scene2').classList.add('show');
    car.style.zIndex = '35';

    /* First environment */
    envIdx = 0;
    activateEnv(0);

    wipeOut();
    tmrID = setTimeout(nextEnv, DURATIONS[1]);
  });
}

function activateEnv(i) {
  ENVS.forEach((e, idx) => {
    const el = $(e.id);
    el.classList.toggle('active', idx === i);
  });
  /* Show caption briefly */
  const cap = $('env-caption');
  cap.classList.remove('show');
  $('cap-title').textContent = ENVS[i].title;
  $('cap-sub').textContent   = ENVS[i].sub;
  setTimeout(() => {
    cap.classList.add('show');
    setTimeout(() => cap.classList.remove('show'), 2000);
  }, 350);
}

function nextEnv() {
  envIdx++;
  updateDots(envIdx + 1);
  if (envIdx < ENVS.length) {
    /* Wipe between envs */
    wipeIn(() => {
      activateEnv(envIdx);
      wipeOut();
      tmrID = setTimeout(envIdx < ENVS.length - 1 ? nextEnv : goScene3, DURATIONS[envIdx + 1] || 3200);
    });
  } else {
    goScene3();
  }
}

/* --- SCENE 3 ------------------------------------------------- */
function goScene3() {
  scene = 5;
  updateDots(5);

  wipeIn(() => {
    /* Hide car */
    car.style.transition = 'opacity 1s ease';
    car.style.opacity    = '0';

    /* Hide scene2 */
    $('scene2').style.opacity = '0';
    $('scene2').style.transition = 'opacity .6s ease';

    $('scene3').classList.add('show');
    wipeOut();
  });
}

/* ════════════════════════════════════════════════════════════════
   WIPE TRANSITION HELPERS
════════════════════════════════════════════════════════════════ */
function wipeIn(cb) {
  wipe.className = '';
  void wipe.offsetWidth; // reflow
  wipe.classList.add('in');
  setTimeout(cb, 760);
}
function wipeOut() {
  setTimeout(() => {
    wipe.style.transformOrigin = 'right';
    wipe.classList.remove('in');
    void wipe.offsetWidth;
    wipe.classList.add('out');
    setTimeout(() => { wipe.className = ''; wipe.style.transformOrigin = ''; }, 780);
  }, 80);
}

/* ════════════════════════════════════════════════════════════════
   ENTER / SKIP
════════════════════════════════════════════════════════════════ */
function doEnter(e) {
  e.preventDefault();
  if (entering) return;
  entering = true;

  flash.classList.add('on');
  setTimeout(() => flash.classList.remove('on'), 180);

  wipe.style.background = '#000';
  wipeIn(() => {
    window.location.href = 'index.html';
  });
}

function doSkip() {
  if (entering) return;
  entering = true;
  cancelAnimationFrame(rafID);
  clearTimeout(tmrID);
  wipeIn(() => { window.location.href = 'index.html'; });
}

/* Keyboard */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') doSkip();
  if (e.key === 'Enter' && scene === 5) doEnter({ preventDefault: ()=>{} });
});

/* ════════════════════════════════════════════════════════════════
   SCENE DOTS
════════════════════════════════════════════════════════════════ */
function updateDots(active) {
  for (let i = 0; i <= 5; i++) {
    const d = $('dot' + i);
    if (!d) continue;
    d.classList.remove('on','done');
    if (i < active)  d.classList.add('done');
    if (i === active) d.classList.add('on');
  }
}

/* Add dot 2–4 at runtime */
function buildDots() {
  const wrap = $('scene-dots');
  for (let i = 2; i <= 4; i++) {
    const d = document.createElement('div');
    d.className = 'sdot';
    d.id = 'dot' + i;
    wrap.appendChild(d);
  }
}

/* ════════════════════════════════════════════════════════════════
   RESIZE
════════════════════════════════════════════════════════════════ */
window.addEventListener('resize', () => {
  VW = innerWidth; VH = innerHeight;
  resizeCanvas();
  if (scene === 0) setS1Paths(s1TrackD());
  else             setS2Paths(s2TrackD());
});

/* ════════════════════════════════════════════════════════════════
   INIT
════════════════════════════════════════════════════════════════ */
function init() {
  VW = innerWidth; VH = innerHeight;
  resizeCanvas();
  buildDots();

  /* Scene 1 track */
  /* Wait one frame so layout is complete */
  requestAnimationFrame(() => {
    setS1Paths(s1TrackD());
    setS2Paths(s2TrackD());

    /* Position car at start of track before loop begins */
    const zRect = s1Zone.getBoundingClientRect();
    car.style.left   = (zRect.left - CAR_W()) + 'px';
    car.style.top    = (zRect.top + zRect.height * 0.74 - CAR_H() * 0.62) + 'px';
    car.style.width  = CAR_W() + 'px';
    car.style.height = CAR_H() + 'px';
    car.style.opacity = '1';

    /* Start loop */
    lastTS = performance.now();
    rafID  = requestAnimationFrame(loop);

    /* Start scene 1 sequence */
    startScene1();
  });
}

window.addEventListener('load', init);
</script>

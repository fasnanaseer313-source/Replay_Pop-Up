<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RePlay — Enter The Experience</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="welcome.css">
</head>
<body>

  <div class="welcome-container" id="welcome-container">
    
    <!-- LEFT PANEL: Text Content -->
    <div class="panel-left">
      <h1 class="welcome-heading">Not a <span class="orange">toy</span><br>Not a <span class="orange">game</span></h1>
      <p class="welcome-subheading2">An <span class="orange-italic">RC experience</span> — right where you are.</p>
    </div>

    <!-- RIGHT PANEL: Cinematic Video (Temporarily moved to temp_video_card.html) -->

    <!-- CTA BUTTON -->
    <div class="cta-container">
      <button class="btn-explore" id="explore-btn">
        Explore The Experience
        <svg class="arrow" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </div>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const exploreBtn = document.getElementById("explore-btn");
      const container = document.getElementById("welcome-container");

      exploreBtn.addEventListener("click", (e) => {
        e.preventDefault();
        
        // Add the exiting class to trigger the CSS transition
        container.classList.add("is-exiting");
        
        // Wait for the transition to finish (1s) before navigating
        setTimeout(() => {
          window.location.href = "index.html";
        }, 1000);
      });
    });
  </script>

</body>
</html>
